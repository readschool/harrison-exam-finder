name: Update index and deploy

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC: scrape the boards, check links, deploy
    - cron: "41 2 * * *"   # every night 02:41 UTC: check links, deploy
  push:
    branches: [main]
    paths: ["site/**", "hef/**", "config/**"]
  workflow_dispatch:
    inputs:
      scrape:
        description: "Scrape the exam boards (not just check links)"
        type: boolean
        default: true
      board:
        description: "Only this board (aqa, ocr, pearson); blank for all"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide what to run
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scrape=${{ inputs.scrape }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 3 * * 1" ]; then
            echo "scrape=true" >> "$GITHUB_OUTPUT"
          else
            echo "scrape=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "check=false" >> "$GITHUB_OUTPUT"
          else
            echo "check=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install headless Chromium
        if: steps.plan.outputs.scrape == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Scrape exam boards
        if: steps.plan.outputs.scrape == 'true'
        # A board having a bad day shouldn't stop the link check or deploy;
        # the scrape report in the run summary shows what went wrong.
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.board }}" ]; then
            python -m hef scrape --board "${{ inputs.board }}"
          else
            python -m hef scrape
          fi

      - name: Check links
        if: steps.plan.outputs.check == 'true'
        run: python -m hef check-links

      - name: Save index changes
        if: steps.plan.outputs.scrape == 'true' || steps.plan.outputs.check == 'true'
        run: |
          git config user.name "harrison-exam-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to the index."
          else
            git commit -m "Update paper index ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Build website
        run: python -m hef build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
