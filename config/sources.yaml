# Harrison Exam Finder - where to look for papers.
#
# Each "seed" is one official board web page that lists past papers.
#   id          unique name, used in reports
#   board       AQA | Pearson Edexcel | OCR (others use the generic rules)
#   level       GCSE | AS | A-level  (default when the page doesn't say)
#   subject     display name on the site
#   spec_code   shown on the site; spec_codes maps level -> code for pages
#               that cover both AS and A-level
#   mode        static  - plain HTML (fast)
#               browser - run the page's JavaScript in headless Chromium
#   browser:    options for browser mode
#     wait_for       CSS selector to wait for before reading the page
#     click_before   list of selectors to click first (e.g. a "Past papers" tab)
#     next_selector  pagination "Next" button; max_pages caps how many pages
#   verified    the page was confirmed to exist when this file was written.
#               Unverified seeds follow the board's usual URL pattern; if one
#               fails, the scrape report says so and you fix the URL here.
#
# After editing, test a single seed with:
#   python -m hef scrape --seed <id> --dry-run --save-raw && python -m hef doctor

settings:
  # Shown in the scraper's User-Agent so boards can contact you. Change this.
  contact: "https://github.com/readschool/harrison-exam-finder"

aqa_browser: &aqa_browser
  mode: browser
  browser:
    wait_for: "a[href*='.pdf' i], a[href*='filestore' i]"
    next_selector: "button:has-text('Next'):not([disabled]), a:has-text('Next')"
    max_pages: 60

pearson_browser: &pearson_browser
  mode: browser
  browser:
    wait_for: "a[href*='.pdf' i]"
    next_selector: "a:has-text('Next'), button:has-text('Next'):not([disabled])"
    max_pages: 40

