# Harrison Exam Finder - where to look for papers.
#
# DISCOVERY (below) reads each board's full list of qualifications and makes a
# "seed" for every GCSE, AS and A-level it finds, so new subjects appear on
# their own. Run `python -m hef discover` to see the list it builds.
#
# SEEDS (at the bottom) are hand-written pages. Use them to add a page that
# discovery misses, or to change the settings for one discovered page: a seed
# with the same url replaces the discovered one's settings.
#
# Seed settings
#   board       AQA | Pearson Edexcel | OCR (others use the generic rules)
#   level       GCSE | AS | A-level  (default when the page doesn't say)
#   subject     the subject filter on the site, e.g. Biology
#   qualification  the heading on the site, e.g. Biology A (Gateway)
#   spec_code   shown on the site; spec_codes maps level -> code for pages
#               that cover both AS and A-level
#   mode        static  - plain HTML (fast)
#               browser - run the page's JavaScript in headless Chromium
#   browser:    options for browser mode
#     wait_for       CSS selector to wait for before reading the page
#     click_before   list of selectors to click first (e.g. a "Past papers" tab)
#     next_selector  pagination "Next" button; max_pages caps how many pages
#   enabled     false to skip a page
#
# Test one page with:
#   python -m hef scrape --seed <id> --dry-run --save-raw && python -m hef doctor

settings:
  # Sent in the scraper's User-Agent so boards can contact you.
  contact: "https://github.com/readschool/harrison-exam-finder"

discovery:
  # ---------------------------------------------------------------- AQA ----
  # AQA's qualification list is plain HTML; each qualification's
  # "Assessment resources" page loads with JavaScript.
  - board: AQA
    listings:
      - https://www.aqa.org.uk/qualifications?level=gcse
      - https://www.aqa.org.uk/qualifications?level=as-and-a-levels
    listing_mode: static
    link_pattern: '^https://www\.aqa\.org\.uk/subjects/[^/]+/(?P<level>gcse|as-level|a-level|aqa-certificate|level-three)/(?P<slug>[^/?#]+?-(?P<code>\d{4}))/?$'
    levels:
      gcse: GCSE
      as-level: AS
      a-level: A-level
      aqa-certificate: Level 2 Certificate
      level-three: Level 3 Certificate
    seed_url: "{url}/assessment-resources"
    seed:
      mode: browser
      browser:
        wait_for: "a[href*='.pdf' i], a[href*='filestore' i]"
        next_selector: "button:has-text('Next'):not([disabled]), a[rel='next'], a:has-text('Next page')"
        max_pages: 60

  # ---------------------------------------------------------------- OCR ----
  # OCR's lists and assessment pages are plain HTML.
  - board: OCR
    listings:
      - https://www.ocr.org.uk/qualifications/gcse/
      - https://www.ocr.org.uk/qualifications/as-and-a-level/
      - https://www.ocr.org.uk/qualifications/cambridge-nationals/
    listing_mode: static
    link_pattern: '^https://www\.ocr\.org\.uk/qualifications/(?P<level>gcse|as-and-a-level|cambridge-nationals)/(?P<slug>[a-z0-9-]*[jh]\d{3}[a-z0-9-]*)/?$'
    code_pattern: '[jh]\d{3}'
    levels:
      gcse: GCSE
      as-and-a-level: A-level
      cambridge-nationals: Cambridge National
    seed_url: "{url}/assessment/"
    seed:
      mode: static

  # ------------------------------------------------------ Pearson Edexcel ----
  # Pearson's lists and "Course materials" pages load with JavaScript; the
  # #filterQuery picks the Exam materials category. A-level pages also carry
  # the AS papers (spec codes starting 8).
  - board: Pearson Edexcel
    listings:
      - https://qualifications.pearson.com/en/qualifications/edexcel-gcses.html
      - https://qualifications.pearson.com/en/qualifications/edexcel-a-levels.html
    listing_mode: browser
    link_pattern: '^https://qualifications\.pearson\.com/en/qualifications/(?P<level>edexcel-gcses|edexcel-a-levels)/(?P<slug>[a-z0-9-]+)\.html$'
    levels:
      edexcel-gcses: GCSE
      edexcel-a-levels: A-level
    seed_url: "{base}.coursematerials.html#filterQuery=category:Pearson-UK:Category%2FExam-materials"
    # Some Pearson pages cover several subjects; the spec code in each
    # filename says which one a paper belongs to.
    subject_by_spec:
      1BI0: Biology
      1CH0: Chemistry
      1PH0: Physics
      1SC0: Combined Science
      1FR1: French
      1GN1: German
      1SP1: Spanish
    seed:
      mode: browser
      browser:
        wait_for: "a[href*='.pdf' i]"
        next_selector: "a:has-text('Next'), button:has-text('Next'):not([disabled])"
        max_pages: 40

  # --------------------------------------------------------- WJEC/Eduqas ----
  # Not set up yet. Their qualification pages have a "Past papers" tab: add a
  # discovery entry like the ones above with click_before pointing at the tab.

seeds: []
